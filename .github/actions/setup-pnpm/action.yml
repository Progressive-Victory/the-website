name: "Setup pnpm"
description: "Install pnpm and deps"
runs:
    using: "composite"
    steps:
        - name: Install pnpm
          uses: pnpm/action-setup@v4
          with:
              version: 9
              run_install: false

        - name: Install Node.js
          uses: actions/setup-node@v4
          with:
              node-version: 20
              cache: "pnpm"

        - name: Install dependencies
          shell: bash
          run: pnpm install --prod=false
