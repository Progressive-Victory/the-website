name: Lint Codebase

on: [push]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install pnpm
              run: npm install pnpm@latest-10
            - name: Install dependencies
              run: pnpm install
            - name: Lint Codebase
              run: pnpm run lint
