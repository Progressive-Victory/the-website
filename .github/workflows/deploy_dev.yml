name: Deploy to Dev
on:
  push:
    branches: [dev]
  workflow_dispatch:
  
jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    env:
      DOCKERFILE: Dockerfile
      REPLACE_ENV_FILE: deployment/deployment.env
      ENV_FILE: .env
      TAG: the_website_dev
    steps:
     - uses: actions/checkout@v2
     - name: Replace Appsettings
       run: cp ${{env.REPLACE_ENV_FILE}} ${{env.ENV_FILE}}
     - name: Log in to the Container registry
       uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
       with:
         registry: ${{ secrets.DOCKER_REGISTRY_URL }}
         username: ${{ secrets.DOCKER_REGISTRY_USER }}
         password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
     - name: lowercase github.repository 
       run:  echo "OWNER_NAME=`echo ${{github.repository_owner}} | tr '[:upper:]' '[:lower:]'`" >>${GITHUB_ENV}
     - name: Build and push Docker images
       id: push
       uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
       with:
         context: .
         push: true
         tags: ${{ secrets.DOCKER_REGISTRY_URL}}/${{ env.TAG }}:now

     - name: Execute remote SSH commands using SSH key
       uses: appleboy/ssh-action@v1
       with:
         host: ${{ secrets.HOST }}
         username: ${{ secrets.USERNAME }}
         key: ${{ secrets.PRIVATE_KEY }}
         script: ./deployscript.sh ${{ secrets.DOCKER_REGISTRY_PASSWORD }} ${{ env.TAG }}
